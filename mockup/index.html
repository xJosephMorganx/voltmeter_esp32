<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32 Voltmeter</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="dashboard" aria-label="ESP32 voltage meter">
        <header class="topbar">
          <div class="brand">
            <svg class="chip-icon" viewBox="0 0 48 48" aria-hidden="true">
              <path class="chip-pin" d="M7 14h5M7 20h5M7 28h5M7 34h5M36 14h5M36 20h5M36 28h5M36 34h5M14 7v5M20 7v5M28 7v5M34 7v5M14 36v5M20 36v5M28 36v5M34 36v5"></path>
              <rect class="chip-body" x="12" y="12" width="24" height="24" rx="2"></rect>
              <rect class="chip-core" x="18" y="18" width="12" height="12" rx="1"></rect>
              <circle class="chip-dot" cx="22" cy="22" r="1.6"></circle>
            </svg>
            <div>
              <p class="eyebrow">ESP32 ADC</p>
              <h1>Voltmeter</h1>
            </div>
          </div>
          <div class="header-telemetry">
            <div class="status" id="connectionStatus" data-state="pending">
              <span class="status-dot"></span>
              <span>Status:</span>
              <span id="statusText">Connecting</span>
            </div>
            <span class="divider" aria-hidden="true"></span>
            <label class="theme-toggle" for="themeToggle">
              <span>Theme</span>
              <input id="themeToggle" type="checkbox">
              <span class="toggle-track" aria-hidden="true">
                <span class="toggle-thumb"></span>
              </span>
            </label>
          </div>
        </header>
        <div class="instrument-grid">
          <section class="gauge-panel" aria-label="Voltage reading">
            <div class="gauge-wrap">
              <svg class="gauge" viewBox="0 0 420 260" role="img" aria-labelledby="gaugeTitle gaugeDesc">
                <title id="gaugeTitle">Voltage gauge</title>
                <desc id="gaugeDesc">A semicircular needle gauge that shows the voltage measured by the ADC.</desc>
                <defs>
                  <linearGradient id="arcGradient" x1="0%" x2="100%" y1="0%" y2="0%">
                    <stop offset="0%" stop-color="#61d66f"></stop>
                    <stop offset="58%" stop-color="#ffd35c"></stop>
                    <stop offset="100%" stop-color="#ff4d48"></stop>
                  </linearGradient>
                  <filter id="needleShadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#05070a" flood-opacity="0.32"></feDropShadow>
                  </filter>
                </defs>
                <path class="arc-bg" d="M 50 210 A 160 160 0 0 1 370 210"></path>
                <path class="arc-value" d="M 50 210 A 160 160 0 0 1 370 210"></path>
                <g id="ticks"></g>
                <g class="needle-group" id="needleGroup">
                  <polygon class="needle" points="210,72 213,210 210,216 207,210"></polygon>
                  <circle class="needle-hub-outer" cx="210" cy="210" r="20"></circle>
                  <circle class="needle-hub-inner" cx="210" cy="210" r="9"></circle>
                </g>
              </svg>
              <div class="readout">
                <span id="voltageValue">--</span>
                <span class="unit">V</span>
              </div>
              <div class="scale-label" aria-hidden="true">Voltage (V)</div>
            </div>
          </section>
          <aside class="control-panel" aria-label="Meter settings">
            <div class="metric raw-metric">
              <span>Raw ADC</span>
              <strong id="rawValue">----</strong>
              <small>0 - 4095</small>
            </div>
            <div class="panel-rule" aria-hidden="true"></div>
            <label class="field">
              <span>Max range</span>
              <select id="rangeSelect">
                <option value="3.3" selected>3.3 V</option>
                <option value="5">5 V</option>
                <option value="12">12 V</option>
                <option value="custom">Custom</option>
              </select>
            </label>
            <label class="field custom-range" id="customRangeField">
              <span>Custom max (V)</span>
              <input id="customMax" type="number" min="0.1" step="0.1" value="3.3">
            </label>
            <p class="formula">Voltage = (ADC / 4095) x Max</p>
          </aside>
        </div>
        <footer class="footer-strip" aria-label="Meter details">
          <span>Poll rate: 1.4 Hz</span>
          <span>Mode: DC</span>
          <span>ADC: 12-bit</span>
        </footer>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
